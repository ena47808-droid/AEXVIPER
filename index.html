
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#061019">
<title>AEXVIPER VIP</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050b12;color:white;
 font-family:Arial,sans-serif;min-height:100vh;
 display:grid;place-items:center;
}
.app{width:100%;max-width:430px;padding:22px;text-align:center}
h2{color:#00ff9d;letter-spacing:3px}
.circle{
 width:90px;height:90px;border:3px solid #00ff9d;
 border-radius:50%;margin:35px auto;
 display:grid;place-items:center;
 color:#00ff9d;font-size:24px;font-weight:bold;
 box-shadow:0 0 25px #00ff9d66;
 cursor:pointer;
}
.panel{
 background:#071610;border:1px solid #00ff9d;
 border-radius:15px;padding:22px;
 box-shadow:0 0 20px #00ff9d22;
}
.status{color:#00ff9d;font-size:13px}
.result{font-size:25px;font-weight:bold;margin:20px 0}
button{
 background:#00ff9d;color:#00130b;border:0;
 padding:14px 25px;border-radius:10px;
 font-weight:bold;font-size:15px;width:100%;
}
.note{font-size:12px;color:#91aaa1;line-height:1.6;margin-top:20px}
</style>
</head>
<body>
<div class="app">
<h2>AEXVIPER</h2>
<div class="circle" id="circle">VIP</div>
<div class="panel">
<div class="status">● AEXVIPER MARKET PANEL</div>
<div class="result" id="result">READY</div>
<button id="scan">START ANALYSIS</button>
<div class="note" id="note">
Waiting for chart data.<br>
No live market connection.
</div>
</div>
<div class="note">AEXVIPER VIP · Mobile Edition</div>
</div>
<script>
const result=document.getElementById('result');
const note=document.getElementById('note');
document.getElementById('scan').onclick=()=>{
 result.textContent='DATA REQUIRED';
 result.style.color='#ffb84d';
 note.textContent='Live chart data is not connected. No CALL or PUT prediction is being generated.';
};
document.getElementById('circle').onclick=()=>{
 document.querySelector('.panel').scrollIntoView({behavior:'smooth'});
};
</script>
</body>
</html>
